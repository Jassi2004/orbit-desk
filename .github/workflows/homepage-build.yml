name: Homepage build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: homepage-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  homepage-build:
    name: Homepage build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:release
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-homepage
          path: dist/index.html
          if-no-files-found: error
          retention-days: 3
